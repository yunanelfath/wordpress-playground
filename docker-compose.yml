services:
  db:
    image: mysql:8
    container_name: wp-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: myStrongPassword123
      MYSQL_DATABASE: school_db
      MYSQL_USER: school_user
      MYSQL_PASSWORD: school_pass
    ports:
      - "3306:3306"
    volumes:
      - db:/var/lib/mysql
volumes:
  db: